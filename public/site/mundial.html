 <div id="areaTimes">

<script>
     function limparSessao(){
    sessionStorage.clear();
    window.location = "../index.html";
}


    let times = [
    { nome: "Corinthians", img: "./../imgs/Corinthians.png", tipo: "br" },
    { nome: "Palmeiras", img: "./../imgs/Palmeiras.png", tipo: "br" },
    { nome: "São Paulo", img: "./../imgs/saopaulo.png", tipo: "br" },
    { nome: "Santos", img: "./../imgs/santos.png", tipo: "br" },
    { nome: "Flamengo", img: "./../imgs/fla.png", tipo: "br" },
    { nome: "Fluminense", img: "./../imgs/cor.png", tipo: "br" },
    { nome: "Botafogo", img: "./../imgs/bota.png", tipo: "br" },
    { nome: "Cruzeiro", img: "./../imgs/cruzeiro.png", tipo: "br" },

    { nome: "Real Madrid", img: "./../imgs/real.png", tipo: "eu" },
    { nome: "Barcelona", img: "./../imgs/barca.webp", tipo: "eu" },
    { nome: "PSG", img: "./../imgs/psg.png", tipo: "eu" },
    { nome: "Chelsea", img: "./../imgs/chelsea.png", tipo: "eu" },
    { nome: "Manchester City", img: "./../imgs/man.png", tipo: "eu" },
    { nome: "Inter de Milão", img: "./../imgs/mila.png", tipo: "eu" },
    { nome: "Bayern de Munique", img: "./../imgs/bay.png", tipo: "eu" }
];
//guarda o time escolhido
let timeEscolhido = null;
//Crio os cards dos times
function carregarTimes() {

    let container = document.getElementById("listaTimes");
    // O forEach percorre todos os times do array
    times.forEach((time, index) => {
// crio a DIV no JS
        let card = document.createElement("div");
        //adiciono uma classe 
        card.classList.add("card-time");
        // aqui eu falo que se o usuário clicar na imagem seleciona o time
        card.innerHTML = `
            <img src="${time.img}" onclick="selecionarTime(${index}, this)">
            <p>${time.nome}</p>
        `;
        //Adiciona no container 
        container.appendChild(card);
    });
}
function selecionarTime(index, el) {
    // guarda o time escolhido
    timeEscolhido = times[index];
    // pega todas as imagens
    let imagens = document.querySelectorAll(".card-time img");
    // remove a seleção de todas
    for (let i = 0; i < imagens.length; i++) {
        imagens[i].classList.remove("selecionado");
    }
    // adiciona seleção na imagem clicada
    el.classList.add("selecionado");
}
function getPeso(time, escolhido) {

    let peso = 0;

    if (time.nome == "Palmeiras") {
        return 1; // em média ganha 1 vez a cada 381 mundiais
    }

    if (time.nome == "Corinthians") {
        peso = 45; 
    }
    else if (time.tipo == "br") {
        peso = 15;
    }
    else if (time.tipo == "eu") {
        peso = 35;
    }
    // bônus do time escolhido
    if (escolhido && time.nome == escolhido.nome && time.nome != "Palmeiras") {
        peso += 5;
    }

    return peso;
}

function sortearCampeao(escolhido) {
    let pesos = [];
    let total = 0;

    // pega o peso de cada time
    for (let i = 0; i < times.length; i++) {
        let pesoTime = getPeso(times[i], escolhido);
        pesos.push(pesoTime);
        total += pesoTime;
    }
    // gera número aleatório
    let random = Math.random() * total;
    let soma = 0;

    // verifica em qual faixa o número caiu
    for (let i = 0; i < times.length; i++) {
        soma += pesos[i];

        if (random <= soma) {
            return times[i];
        }
    }
    return times[0];
}

function simular50Anos(escolhido) {

    let resultados = {};

    // inicializa todos os times com 0 títulos
    for (let i = 0; i < times.length; i++) {
        let nomeTime = times[i].nome;
        resultados[nomeTime] = 0;
    }
    // simula 50 anos
    for (let i = 0; i < 50; i++) {
        let campeao = sortearCampeao(escolhido);
        resultados[campeao.nome]++;
    }
    return resultados;
}

function gerarRanking(resultados) {

    let lista = [];
    // percorre os resultados
    for (let nome in resultados) {
        let imgTime = "";

        // procura o time no array times
        for (let i = 0; i < times.length; i++) {

            if (times[i].nome == nome) {
                imgTime = times[i].img;
            }
        }
        // adiciona no ranking
        lista.push({
            nome: nome,img: imgTime, vitorias: resultados[nome]
        });
    }
    // ordena por vitórias
    lista.sort(function(a, b) {
        return b.vitorias - a.vitorias;
    });
    return lista;
}

function apostar() {
    let msg = document.getElementById("msg");
    let area = document.getElementById("areaTimes");

    // verifica se escolheu um time
    if (timeEscolhido == null) {
        alert("Escolha um time primeiro!");
        return;
    }
    // simula os 50 anos
    let resultados = simular50Anos(timeEscolhido);
    // gera ranking
    let ranking = gerarRanking(resultados);
    // esconde área dos times
    area.style.display = "none";
    // HTML do time escolhido
    let meuTimeHTML = "";

    meuTimeHTML += '<div class="meu-time">';
    meuTimeHTML += '<h2>Você escolheu</h2>';
    meuTimeHTML += '<img src="' + timeEscolhido.img + '">';
    meuTimeHTML += '<h3>' + timeEscolhido.nome + '</h3>';
    meuTimeHTML += '<p><b>';
    meuTimeHTML += resultados[timeEscolhido.nome] + ' títulos';
    meuTimeHTML += '</b></p>';
    meuTimeHTML += '</div>';

    // HTML do ranking
    let listaHTML = "";

    listaHTML += '<h2>Ranking Geral (50 anos)</h2>';
    listaHTML += '<div class="ranking-lista">';

    // percorre ranking
    for (let i = 0; i < ranking.length; i++) {

        listaHTML += '<div class="item-ranking">';
        listaHTML += '<h3>#' + (i + 1) + '</h3>';
        listaHTML += '<img src="' + ranking[i].img + '" class="img-ranking">';
        listaHTML += '<p>';
        listaHTML += '<b>' + ranking[i].nome + '</b>';
        listaHTML += ' - ' + ranking[i].vitorias + ' títulos';
        listaHTML += '</p>';
        listaHTML += '</div>';
    }
    listaHTML += '</div>';
    // mostra resultado
    msg.style.display = "block";
    // HTML final
    msg.innerHTML = "";
    msg.innerHTML += '<h1>Simulação de 50 anos</h1>';
    msg.innerHTML += meuTimeHTML;
    msg.innerHTML += listaHTML;
    msg.innerHTML += ` <button onclick="location.reload()" class="btn-reload"> Simular novamente </button> `;
}
cargo_usuario.innerHTML = sessionStorage.NOME_USUARIO;
carregarTimes();
</script>

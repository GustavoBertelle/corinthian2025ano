<body>

<header class="header">

        <a href="#" class="logo">
            <img src="imgs/Logo_cor_branca.png" alt="logo">
        </a>

        <nav class="navbar">

            <a href="#quiz">Quiz</a>

        </nav>

</header>
<body>

<div class="main-login">

    <div class="left-login">
        
        <img src="imgs/torcida.jpg" class="left-image" alt="torcida">
    </div>

    <div class="right-login">
        <div class="card-login">

            <div class="titulo">

                <img src="imgs/Logo_cor_branca.png" class="escudo">
            <h1>LOGIN</h1>
            <img src="imgs/Logo_cor_branca.png" class="escudo">
                </div>

   <div class="textfield">
                <label for="email">Email</label>
                <input type="text" id="ipt_email" name="email" placeholder="@Email">
                <span id="msg_email"></span>
            </div>

    <div class="textfield">
    <label for="senha">Senha</label>
    
    <div class="senha-container">

    <input type="password" id="ipt_senha" name="senha" placeholder="Senha">

    <img src="imgs/olho_fechado.png" id="icone_olho" class="olho" onclick="olhoSenha()">

    </div>
    </div>
        <span id="msg_senha"></span>

       <div class="textfield">
    </div>


            <button onclick="login()" class="btn-login">Login</button>
            <br>
                        <p class="pcad">
                Ainda não possui cadastro?
                <a href="cadastro.html" id="btn_cadastro" class="btn_cadastro">Cadastro</a>
            </p>
        </div>
    </div>

</div>
<div id="msg">

</div>
</body>
</html>

<script>

function olhoSenha() {
    const input = document.getElementById("ipt_senha");
    const icone = document.getElementById("icone_olho");

    if (input.type === "password") {
        input.type = "text";
        icone.src = "imgs/olho_aberto.png";
    } else {
        input.type = "password";
        icone.src = "imgs/olho_fechado.png";
    }
}

function login() {

    var emailVar = ipt_email.value;
    var senhaVar = ipt_senha.value;

    var msg = document.getElementById("msg");

    if (emailVar == "" || senhaVar == "") {

        msg.innerHTML = "Preencha todos os campos!";
        return false;
    }

    console.log("FORM LOGIN:", emailVar);
    console.log("FORM SENHA:", senhaVar);

    fetch("/usuarios/autenticar", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({
            emailServer: emailVar,
            senhaServer: senhaVar
        })
    })

    .then(function (resposta) {

        if (resposta.ok) {

            resposta.json().then(json => {

                sessionStorage.EMAIL_USUARIO = json.email;
                sessionStorage.NOME_USUARIO = json.nome;
                sessionStorage.ID_USUARIO = json.id;

                msg.innerHTML = "Login realizado com sucesso!";

                setTimeout(function () {
                    window.location = "./dashboard/cards.html";
                }, 1000);

            });

        } else {

            resposta.text().then(texto => {

                msg.innerHTML = "Email ou senha inválidos!";
                console.error(texto);

            });
        }

    })

    .catch(function (erro) {

        console.log(erro);
        msg.innerHTML = "Erro ao realizar login.";

    });

    return false;
}

</script>

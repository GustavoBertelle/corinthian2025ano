<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro</title>
    <link rel="stylesheet" href="cadastro.css">
</head>
<body>

<div class="main-login">

    <div class="left-login">
        
        <img src="torcida.jpg" class="left-image" alt="torcida">
    </div>

    <div class="right-login">
        <div class="card-login">

            <div class="titulo">
                <img src="Logo_cor_branca.png" class="escudo">
            <h1>Cadastro</h1>
            <img src="Logo_cor_branca.png" class="escudo">
                </div>

            <div class="textfield">
                <label for="email">Nome</label>
                <input type="text" id="ipt_nome" name="nome" placeholder="Nome" oninput="vlNome()">
                <span id="msg_nome"></span>
            </div>

            <div class="textfield">
                <label for="email">Email</label>
                <input type="text" id="ipt_email" name="email" placeholder="@Email" oninput="vlEmail()">
                <span id="msg_email"></span>
            </div>

    <div class="textfield">
    <label for="senha">Senha</label>
    
    <div class="senha-container">
    <input type="password" id="ipt_senha" name="senha" placeholder="Senha" oninput="vlSenha()">
    <img src="olho_fechado.png" id="icone_olho" class="olho" onclick="olhoSenha()">
    <span id="msg_senha"></span>
    </div>

       <div class="textfield">
    <label for="senha">Confirmar Senha</label>   
    <div class="senha-container">
    <input type="password" id="ipt_cf_senha" name="cf_senha" placeholder="Confirmar Senha" oninput="cnfSenha()">
    <span id="msg_conf"></span>
    <img src="olho_fechado.png" id="cf_icone_olho" class="olho" onclick="cf_olhoSenha()">
    </div>
    </div>

            <button class="btn-login" onclick="cadastro()">Cadastro</button>

            <p>
                Já possui uma conta?
                <a href="login.html" id="btn_login">Login</a>
            </p>
        </div>
        </div>
    </div>

</div>

</body>
</html>
<script>

function olhoSenha() {
    const input = document.getElementById("ipt_senha");
    const icone = document.getElementById("icone_olho");

    if (input.type === "password") {
        input.type = "text";
        icone.src = "olho_aberto.png";
    } else {
        input.type = "password";
        icone.src = "olho_fechado.png";
    }
}
function cf_olhoSenha() {
    const input = document.getElementById("ipt_cf_senha");
    const icone = document.getElementById("cf_icone_olho");

    if (input.type === "password") {
        input.type = "text";
        icone.src = "olho_aberto.png";
    } else {
        input.type = "password";
        icone.src = "olho_fechado.png";
    }
}

    function vlNome() {
            let nome = ipt_nome.value;
            if (nome.length <= 2) {
                msg_nome.innerHTML = `<span class="erro">✖ Nome inválido</span>`;
            } else {
                msg_nome.innerHTML = `<span class="certo">✔ Nome válido</span>`;
            }
        }

        function vlEmail() {
            let email = ipt_email.value;
            if (email.includes('@')) {
                msg_email.innerHTML = `<span class="certo">✔ Email válido</span>`;
            } else {
                msg_email.innerHTML = `<span class="erro">✖ Precisa conter @</span>`;
            }
        }
        function vlSenha() {
            let senha = ipt_senha.value;
            if (senha.length < 6) {
                msg_senha.innerHTML = `<span class="erro">✖ Senha fraca</span>`;
            } else if (senha.includes('@')) {
                msg_senha.innerHTML = `<span class="certo">✔ Senha forte</span>`;
            } else {
                msg_senha.innerHTML = `<span class="media">⚠ Senha média. <span class="erro">A senha precisa conter uma caractere especial</span>`;
            }
        }
        function cnfSenha() {
            let senha = ipt_senha.value;
            let conf = ipt_confirm_senha.value;
            if (senha === conf && senha !== "") {
                msg_conf.innerHTML = `<span class="certo">✔ Senhas iguais</span>`;
            } else {
                msg_conf.innerHTML = `<span class="erro">✖ Senhas diferentes</span>`;
            }
        }
        
        function cadastro() {
            let nome = ipt_nome.value;
            let email = ipt_email.value;
            let senha = ipt_senha.value;
            let conf_senha = ipt_confirm_senha.value;
            let erro = false;

            msg_nome.innerHTML = "";
            msg_email.innerHTML = "";
            msg_senha.innerHTML = "";
            msg_conf.innerHTML = "";
            msg.innerHTML = "";

            if (nome.length <= 2) {
                msg_nome.innerHTML = `<span class="erro">✖ Nome inválido</span>`;
                erro = true;
            }

            if (!email.includes('@')) {
                msg_email.innerHTML = `<span class="erro">✖ Email inválido</span>`;
                erro = true;
            }
            if (senha.length < 6) {
                msg_senha.innerHTML = `<span class="erro">✖ Senha muito curta</span>`;
                erro = true;
            }
            if (senha != conf_senha) {
                msg_conf.innerHTML = `<span class="erro">✖ Senhas não coincidem</span>`;
                erro = true;
            }

            if (!erro) {
                formu.style.display = "none";
                msg.innerHTML = `<b>✔ Conta criada com sucesso para <br>${nome}!</b>`;
                btn_voltar.style.display = "inline-block";
            }
        }
</script>

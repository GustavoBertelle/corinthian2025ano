<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Carrossel Flip</title>

<style>

body{
    margin:0;
    background:#111;
    font-family:Arial, sans-serif;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    color:white;
}

.container{
    display:flex;
    align-items:center;
    gap:30px;
}

button{
    width:60px;
    height:60px;
    border:none;
    border-radius:50%;
    background:#222;
    color:white;
    font-size:30px;
    cursor:pointer;
    transition:0.3s;
}

button:hover{
    background:#444;
}

.card{
    width:350px;
    height:500px;
    perspective:1000px;
    cursor:pointer;
}

.card-inner{
    width:100%;
    height:100%;
    position:relative;
    transform-style:preserve-3d;
    transition:transform 0.8s;
}

.card.ativo .card-inner{
    transform:rotateY(180deg);
}

.frente,
.verso{
    position:absolute;
    width:100%;
    height:100%;
    border-radius:20px;
    overflow:hidden;
    backface-visibility:hidden;
}

.frente img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.verso{
    background:#1f1f1f;
    transform:rotateY(180deg);

    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;

    padding:30px;
    box-sizing:border-box;
    text-align:center;
}

h2{
    margin-bottom:15px;
}

</style>
</head>

<body>

<div class="container">

    <button id="anterior"><</button>

    <div class="card" id="card">

        <div class="card-inner">

            <div class="frente">
                <img id="imagem" src="">
            </div>

            <div class="verso">
                <h2 id="titulo"></h2>
                <p id="descricao"></p>
            </div>

        </div>

    </div>

    <button id="proximo">></button>

</div>

<script>

const dados = [

{
    imagem:"https://picsum.photos/id/1015/400/600",
    titulo:"Montanhas",
    descricao:"Paisagem incrível com clima frio e natureza."
},

{
    imagem:"https://picsum.photos/id/1016/400/600",
    titulo:"Praia",
    descricao:"Lugar perfeito para relaxar e aproveitar o mar."
},

{
    imagem:"https://picsum.photos/id/1025/400/600",
    titulo:"Cachorro",
    descricao:"Um cachorro feliz aproveitando o dia."
}

];

let index = 0;

const imagem = document.getElementById("imagem");
const titulo = document.getElementById("titulo");
const descricao = document.getElementById("descricao");
const card = document.getElementById("card");

function carregarCard(){

    imagem.src = dados[index].imagem;
    titulo.textContent = dados[index].titulo;
    descricao.textContent = dados[index].descricao;

    card.classList.remove("ativo");
}

carregarCard();

document.getElementById("proximo").addEventListener("click", () => {

    index++;

    if(index >= dados.length){
        index = 0;
    }

    carregarCard();

});

document.getElementById("anterior").addEventListener("click", () => {

    index--;

    if(index < 0){
        index = dados.length - 1;
    }

    carregarCard();

});

card.addEventListener("click", () => {
    card.classList.toggle("ativo");
});

</script>

</body>
</html>

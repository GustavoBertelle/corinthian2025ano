<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro</title>
    <link rel="stylesheet" href="cadastro.css">
    <link rel="stylesheet" href="home.css">
</head>
<header class="header">
    <div class="container">
        <a href="#" class="logo">
            <img src="imgs/Logo_cor_branca.png" alt="logo">
        </a>

        <nav class="navbar">
            <a href="home.html">Home</a>
            <a href="#hist">História</a>
            <a href="#gols">Top 10° Gols</a>
            <a href="#mundi">Mundial</a>
            <a href="#quiz">Quiz</a>
            <a href="login.html">Login</a>
        </nav>
    </div>
</header>
<body>

<div class="main-login">

    <div class="left-login">
        
        <img src="imgs/torcida.jpg" class="left-image" alt="torcida">
    </div>

    <div class="right-login">
        <div class="card-login">

            <div class="titulo">
                <img src="imgs/Logo_cor_branca.png" class="escudo">
            <h1>Cadastro</h1>
            <img src="imgs/Logo_cor_branca.png" class="escudo">
                </div>

            <div class="textfield">
                <label for="email">Nome</label>
                <input type="text" id="ipt_nome" name="nome" placeholder="Nome" oninput="vlNome()">
                <span id="msg_nome"></span>
            </div>

            <div class="textfield">
                <label for="email">Email</label>
                <input type="text" id="ipt_email" name="email" placeholder="@Email" oninput="vlEmail()">
                <span id="msg_email"></span>
            </div>

        <div class="textfield">
    <label for="senha">Senha</label>
    
    <div class="senha-container">

    <input type="password" id="ipt_senha" name="senha" placeholder="Senha" oninput="vlSenha()">

    <img src="imgs/olho_fechado.png" id="icone_olho" class="olho" onclick="olhoSenha()">

    </div>
    </div>

        <span id="msg_senha"></span>

       <div class="textfield">

    <label for="senha">Confirmar Senha</label>   
    
    <div class="senha-container">

    <input type="password" id="ipt_cf_senha" name="cf_senha" placeholder="Confirmar Senha" oninput="cnfSenha()">


    <img src="imgs/olho_fechado.png" id="cf_icone_olho" class="olho" onclick="cf_olhoSenha()">
    </div>
       <span id="msg_conf"></span>
    </div>

            <button class="btn-cadastro" onclick="cadastro()">Cadastro</button>
<div class="btn-login">
            <p class="plog">
                Já possui uma conta?
                <a href="login.html" id="btn_login" class="btn_login">Login</a>
            </p>
            </div>
        </div>
        </div>
    </div>

</div>
<div id="msg"></div> 
</body>
</html>
<script>

function olhoSenha() {
    const input = document.getElementById("ipt_senha");
    const icone = document.getElementById("icone_olho");

    if (input.type === "password") {
        input.type = "text";
        icone.src = "imgs/olho_aberto.png";
    } else {
        input.type = "password";
        icone.src = "imgs/olho_fechado.png";
    }
}
function cf_olhoSenha() {
    const input = document.getElementById("ipt_cf_senha");
    const icone = document.getElementById("cf_icone_olho");

    if (input.type === "password") {
        input.type = "text";
        icone.src = "imgs/olho_aberto.png";
    } else {
        input.type = "password";
        icone.src = "imgs/olho_fechado.png";
    }
}

    function vlNome() {
            let nome = ipt_nome.value;
            if (nome.length <= 2) {
                msg_nome.innerHTML = `<span class="erro">✖ Nome inválido</span>`;
            } else {
                msg_nome.innerHTML = `<span class="certo">✔ Nome válido</span>`;
            }
        }

        function vlEmail() {
            let email = ipt_email.value;
            if (email.includes('@')) {
                msg_email.innerHTML = `<span class="certo">✔ Email válido</span>`;
            } else {
                msg_email.innerHTML = `<span class="erro">✖ Precisa conter @</span>`;
            }
        }
        function vlSenha() {
            let senha = ipt_senha.value;

            let temEspecial =
                senha.includes('@') ||
                senha.includes('#') ||
                senha.includes('%') ||
                senha.includes('&') ||
                senha.includes('$');

            if (senha.length >= 6 && temEspecial) {
            msg_senha.innerHTML = `<span class="certo">✔ Senha forte</span>`;
        } 
            else if (senha.length < 6 && temEspecial) {
            msg_senha.innerHTML = `<span class="media">⚠ Senha média (curta, mas tem especial)</span>`;
        } 
            else if (senha.length >= 6 && !temEspecial) {
            msg_senha.innerHTML = `<span class="media">⚠ Senha média (falta caractere especial)</span>`;
        } 
            else {
            msg_senha.innerHTML = `<span class="erro">✖ Senha fraca</span>`;
            }
        }
        function cnfSenha() {
            let senha = ipt_senha.value;
            let conf = ipt_cf_senha.value;
            if (senha === conf && senha !== "") {
                msg_conf.innerHTML = `<span class="certo">✔ Senhas iguais</span>`;
            } else {
                msg_conf.innerHTML = `<span class="erro">✖ Senhas diferentes</span>`;
            }
        }
        
        
        function cadastro() {
            let msg = document.getElementById("msg");
            
            let nome = ipt_nome.value;
            let email = ipt_email.value;
            let senha = ipt_senha.value;
            let conf_senha =ipt_cf_senha.value;
            let erro = false;

            msg_nome.innerHTML = "";
            msg_email.innerHTML = "";
            msg_senha.innerHTML = "";
            msg_conf.innerHTML = "";
            msg.innerHTML = "";

            if (nome.length <= 2) {
                msg_nome.innerHTML = `<span class="erro">✖ Nome inválido</span>`;
                erro = true;
            }

            if (!email.includes('@')) {
                msg_email.innerHTML = `<span class="erro">✖ Email inválido</span>`;
                erro = true;
            }

            if (senha.length < 6) {
                msg_senha.innerHTML = `<span class="erro">✖ Senha muito curta</span>`;
                erro = true;
            }
            if (!senha.includes('@') &&
                !senha.includes('#') &&
                !senha.includes('%') &&
                !senha.includes('&') &&
                !senha.includes('$')){
                 msg_senha.innerHTML = `<span class="erro">✖ Senha sem caracteres especiais</span>`;
                erro = true;
                }

            if (senha != conf_senha) {
                msg_conf.innerHTML = `<span class="erro">✖ Senhas não coincidem</span>`;
                erro = true;
            }

            if (!erro) {
                alert(`conta criada com sucesso`);

            }
        }
        
</script>

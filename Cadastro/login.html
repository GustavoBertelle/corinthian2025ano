<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="login.css">
</head>
<body>

<div class="main-login">

    <div class="left-login">
        
        <img src="torcida.jpg" class="left-image" alt="torcida">
    </div>

    <div class="right-login">
        <div class="card-login">

            <div class="titulo">

                <img src="Logo_cor_branca.png" class="escudo">
            <h1>LOGIN</h1>
            <img src="Logo_cor_branca.png" class="escudo">
                </div>

            <div class="textfield">
                <label for="usuario">Email</label>
                <input type="text" id="ipt_usuario" name="usuario" placeholder="@Email">
            </div>

    <div class="textfield">
    <label for="senha">Senha</label>
    
    <div class="senha-container">
    <input type="password" id="ipt_senha" name="senha" placeholder="Senha">
    <img src="olho_fechado.png" id="icone_olho" class="olho" onclick="olhoSenha()">
    </div>
    </div>

            <button class="btn-login">Login</button>
        </div>
    </div>

</div>

</body>
</html>
<script>

function olhoSenha() {
    const input = document.getElementById("ipt_senha");
    const icone = document.getElementById("icone_olho");

    if (input.type === "password") {
        input.type = "text";
        icone.src = "olho_aberto.png";
    } else {
        input.type = "password";
        icone.src = "olho_fechado.png";
    }
}
</script>
